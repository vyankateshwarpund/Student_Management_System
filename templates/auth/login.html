<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Student Management System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1200;"></div>

    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle shadow-sm mb-3" style="width: 56px; height: 56px;">
                <i class="bi bi-mortarboard-fill fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark">EduManager</h3>
            <p class="text-muted small">Sign in to your institutional account</p>
        </div>

        <div class="card border-0 shadow-sm p-4 rounded-4">
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" id="username" class="form-control bg-light border-start-0" placeholder="e.g. admin1 or admin@test.com" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label class="form-label small fw-semibold text-secondary">Password</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" id="password" class="form-control bg-light border-start-0" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
                    <span>Sign In</span>
                </button>
            </form>

            <!-- Quick Demo Credentials Box -->
            <div class="p-3 bg-light rounded-3 border small">
                <div class="fw-semibold text-secondary mb-2 d-flex align-items-center gap-1">
                    <i class="bi bi-lightning-charge-fill text-warning"></i> Quick Demo Logins:
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-sm btn-outline-secondary py-1 px-2 demo-btn" data-user="admin1" data-pass="TestPass123!">Admin</button>
                    <button class="btn btn-sm btn-outline-secondary py-1 px-2 demo-btn" data-user="teacher1" data-pass="TeacherPass123!">Teacher</button>
                    <button class="btn btn-sm btn-outline-secondary py-1 px-2 demo-btn" data-user="student1" data-pass="TestPass123!">Student</button>
                </div>
            </div>

            <div class="text-center mt-4 text-muted small">
                <div class="d-inline-flex align-items-center gap-1 text-secondary fw-semibold">
                    <i class="bi bi-shield-lock-fill text-primary"></i> Protected Institutional System
                </div>
                <div class="mt-1 text-muted" style="font-size: 0.78rem;">
                    Self-registration is disabled. Student &amp; Faculty credentials are provisioned exclusively by the Administrator.
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & API JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Fill demo credentials on button click
            document.querySelectorAll('.demo-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.getElementById('username').value = btn.dataset.user;
                    document.getElementById('password').value = btn.dataset.pass;
                });
            });

            // Handle Login Form Submission
            const form = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';

                try {
                    const res = await api.post('/auth/login/', { username, password });
                    auth.setSession(res.data.tokens, res.data.user);
                    showToast('Login successful! Redirecting...', 'success');

                    setTimeout(() => {
                        const role = res.data.user.role;
                        if (role === 'admin') window.location.href = '/dashboard/admin/';
                        else if (role === 'teacher') window.location.href = '/dashboard/teacher/';
                        else window.location.href = '/dashboard/student/';
                    }, 600);
                } catch (err) {
                    showToast(err.message || 'Invalid username or password', 'danger');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Sign In</span>';
                }
            });
        });
    </script>
</body>
</html>
