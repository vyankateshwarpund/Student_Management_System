<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Student Management System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1200;"></div>

    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle shadow-sm mb-3" style="width: 56px; height: 56px;">
                <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark">Reset Password</h3>
            <p class="text-muted small">Set a new secure password for your account</p>
        </div>

        <div class="card border-0 shadow-sm p-4 rounded-4">
            <form id="resetForm">
                <input type="hidden" id="resetUid">
                <input type="hidden" id="resetToken">

                <div id="tokenManualSection" class="mb-3 d-none">
                    <label class="form-label small fw-semibold text-secondary">Reset Token</label>
                    <input type="text" id="manualToken" class="form-control bg-light" placeholder="Enter reset token provided">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" id="newPassword" class="form-control bg-light border-start-0" placeholder="Minimum 8 characters" required minlength="8">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Confirm New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" id="confirmPassword" class="form-control bg-light border-start-0" placeholder="Re-enter password" required minlength="8">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
                    <span>Update Password</span>
                </button>

                <div class="text-center">
                    <a href="/login/" class="text-decoration-none small text-secondary fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap & API JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('uid');
            const token = urlParams.get('token');

            if (uid) document.getElementById('resetUid').value = uid;
            if (token) {
                document.getElementById('resetToken').value = token;
            } else {
                // If not in URL, display manual token input
                document.getElementById('tokenManualSection').classList.remove('d-none');
            }

            const form = document.getElementById('resetForm');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPass = document.getElementById('newPassword').value;
                const confirmPass = document.getElementById('confirmPassword').value;
                const activeUid = document.getElementById('resetUid').value.trim();
                const activeToken = (document.getElementById('resetToken').value || document.getElementById('manualToken')?.value || '').trim();

                if (!activeUid || !activeToken) {
                    showToast('Missing reset token. Please request a new password reset link.', 'danger');
                    return;
                }

                if (newPass !== confirmPass) {
                    showToast('Passwords do not match.', 'danger');
                    return;
                }

                if (newPass.length < 8) {
                    showToast('Password must be at least 8 characters long.', 'danger');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Updating...';

                try {
                    const res = await api.post('/auth/reset-password-confirm/', {
                        uid: activeUid,
                        token: activeToken,
                        new_password: newPass
                    });
                    showToast(res.message || 'Password reset successful! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login/';
                    }, 1200);
                } catch (err) {
                    showToast(err.message || 'Password reset failed. Token may be invalid or expired.', 'danger');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Update Password</span>';
                }
            });
        });
    </script>
</body>
</html>
