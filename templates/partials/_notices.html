<!-- Campus Notices & Bulletin Board Component -->
<div class="card p-3 mb-4 border-0 shadow-sm">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex align-items-center gap-2">
            <div class="stat-icon bg-warning bg-opacity-10 text-warning fs-5" style="width: 38px; height: 38px;">
                <i class="bi bi-megaphone-fill"></i>
            </div>
            <div>
                <h6 class="fw-bold text-dark mb-0">Campus Bulletin Board & Circulars</h6>
                <small class="text-muted">Official announcements and notifications</small>
            </div>
        </div>
        <div data-role="admin,teacher">
            <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#announcementModal">
                <i class="bi bi-plus-circle me-1"></i> Post Circular
            </button>
        </div>
    </div>

    <!-- Announcements Feed -->
    <div id="announcementsFeed" class="list-group list-group-flush">
        <div class="text-center py-3 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading campus circulars...</div>
    </div>
</div>

<!-- Post Announcement Modal -->
<div class="modal fade" id="announcementModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Publish Campus Circular</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="announcementForm">
                <div class="modal-body py-3">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Circular Title *</label>
                        <input type="text" id="annTitle" class="form-control" placeholder="e.g. Schedule for Mid-Term Examination 2026" required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-secondary">Category *</label>
                            <select id="annCategory" class="form-select" required>
                                <option value="general" selected>General Bulletin</option>
                                <option value="urgent">Urgent Notice</option>
                                <option value="exam">Examination & Results</option>
                                <option value="academic">Academic Circular</option>
                                <option value="holiday">Holiday Notification</option>
                                <option value="event">Campus Event</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-secondary">Audience *</label>
                            <select id="annTarget" class="form-select" required>
                                <option value="all" selected>All Members</option>
                                <option value="students">Students Only</option>
                                <option value="teachers">Faculty Only</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Notice Content *</label>
                        <textarea id="annContent" class="form-control" rows="4" placeholder="Detailed announcement content..." required></textarea>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="annPinned">
                        <label class="form-check-label small fw-semibold text-secondary" for="annPinned">
                            Pin this announcement to top of the bulletin board
                        </label>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" id="saveAnnBtn" class="btn btn-primary">Publish Circular</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
async function loadAnnouncements() {
    const feed = document.getElementById('announcementsFeed');
    if (!feed) return;

    try {
        const res = await api.get('/announcements/');
        const notices = res.results || res.data || [];

        if (!notices.length) {
            feed.innerHTML = '<div class="text-center py-3 text-muted">No active campus circulars right now.</div>';
            return;
        }

        const catColors = {
            urgent: 'bg-danger text-white',
            exam: 'bg-primary text-white',
            academic: 'bg-info text-dark',
            holiday: 'bg-success text-white',
            event: 'bg-warning text-dark',
            general: 'bg-secondary text-white'
        };

        feed.innerHTML = notices.map(n => `
            <div class="list-group-item px-0 py-3 border-bottom">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                    <div>
                        ${n.is_pinned ? '<i class="bi bi-pin-angle-fill text-danger me-1" title="Pinned to Top"></i>' : ''}
                        <span class="badge ${catColors[n.category] || 'bg-secondary text-white'} text-uppercase me-2" style="font-size: 0.72rem;">${n.category}</span>
                        <span class="fw-bold text-dark fs-6">${n.title}</span>
                    </div>
                    <span class="text-muted small">${new Date(n.created_at).toLocaleDateString()}</span>
                </div>
                <p class="text-secondary small mb-1 mt-1">${n.content}</p>
                <div class="text-muted small" style="font-size: 0.75rem;">
                    Posted by <strong class="text-dark">${n.author_name || 'Administration'}</strong> &bull; Audience: <span class="text-capitalize">${n.target_role}</span>
                </div>
            </div>
        `).join('');

    } catch (err) {
        feed.innerHTML = '<div class="text-center py-3 text-danger">Failed to load bulletins.</div>';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadAnnouncements();

    const annForm = document.getElementById('announcementForm');
    if (annForm) {
        annForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                title: document.getElementById('annTitle').value.trim(),
                category: document.getElementById('annCategory').value,
                target_role: document.getElementById('annTarget').value,
                content: document.getElementById('annContent').value.trim(),
                is_pinned: document.getElementById('annPinned').checked
            };

            const btn = document.getElementById('saveAnnBtn');
            btn.disabled = true;

            try {
                await api.post('/announcements/', payload);
                showToast('Circular published to campus board', 'success');
                bootstrap.Modal.getInstance(document.getElementById('announcementModal')).hide();
                annForm.reset();
                loadAnnouncements();
            } catch (err) {
                showToast(err.message || 'Failed to post circular', 'danger');
            } finally {
                btn.disabled = false;
            }
        });
    }
});
</script>
